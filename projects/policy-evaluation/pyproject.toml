[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paired-cs"
version = "1.0.1"
description = "Sequential paired selection and paired confidence-sequence regret certification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
paired-cs = "paired_cs.cli:main"

[tool.setuptools]
packages = ["paired_cs"]
